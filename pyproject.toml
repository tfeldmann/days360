[project]
name = "days360"
version = "1.0.2"
description = "Excel's DAYS360() formula for python."
authors = [{ name = "Thomas Coenen", email = "mail@tcoenen.de" }]
requires-python = "~=3.8"
readme = "README.md"
license = "MIT"
keywords = [
    "excel",
    "formula",
    "finance",
    "days360",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/tfeldmann/days360"

[dependency-groups]
dev = [
    "ruff>=0.0.277,<0.0.278",
    "mypy>=1.4.1,<2",
    "pytest>=7.4.0,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
